services:
  postgres:
    image: postgres:16-alpine
    container_name: savings-postgres
    environment:
      POSTGRES_DB: savings
      POSTGRES_USER: savings
      POSTGRES_PASSWORD: savings
    ports:
      # Host port is overridable (clashes on shared dev boxes); container side is standard.
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savings -d savings"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: savings-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API itself, packaged per the requirement: whole app in Docker, Alpine base.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: savings-api:1.0.0
    container_name: savings-app
    environment:
      # In-container addressing: service names, not host-mapped ports.
      DB_URL: jdbc:postgresql://postgres:5432/savings
      DB_USER: savings
      DB_PASSWORD: savings
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # API acceptance suite: hurl files executed inside the official hurl image,
  # attachable to the same network (docker compose --profile tests up / run).
  # Kept out of the default profile: `docker compose up` starts the app, not tests.
  # NOTE: the hurl image ENTRYPOINT is hurl itself - do not repeat the word in command.
  hurl:
    image: ghcr.io/orange-opensource/hurl:8.1.0
    profiles: ["tests"]
    container_name: savings-hurl
    volumes:
      - ./hurl:/hurl:ro
    command: ["--test", "--variable", "host=app", "--variable", "suffix=${RUN_SUFFIX_LETTERS:-beta}", "/hurl/api.hurl"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:

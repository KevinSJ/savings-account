spring:
  application:
    name: savings-accounts-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/savings}
    username: ${DB_USER:savings}
    password: ${DB_PASSWORD:savings}
    hikari:
      # Bounded pool: fail fast instead of piling up connections when Postgres is down.
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 2000

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by schema.sql (single table, no migrations yet - see TODO).
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  sql:
    init:
      mode: always
      # Kept under db/ to leave room for a future migration tool alongside it.
      schema-locations: classpath:db/schema.sql

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # No auth layer in the exercise, so when-authorized == never visible; always
      # is the honest choice for an operator reading it locally (review finding #8).
      show-details: always
      group:
        # Readiness = "can serve traffic": only the datastore. A dead Redis must not
        # pull the instance out of rotation because reads degrade to Postgres anyway;
        # redis stays in the overall health aggregate for dashboards.
        readiness:
          include: db
  health:
    redis:
      enabled: true

logging:
  level:
    com.takehome.savings: INFO
    org.hibernate.SQL: WARN

---
# Profile for local dev: verbose SQL, show full health details.
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true

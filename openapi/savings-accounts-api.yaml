openapi: 3.1.0
info:
  title: Savings Account API
  version: "1.0.0"
  summary: Create and read savings bank accounts
  description: |
    Take-home exercise API. Documents the features actually implemented in this
    repository - no aspirational endpoints.

    Domain rules implemented server-side:
    * `id` and `accountNumber` are generated by the API (never accepted from callers).
    * `accountNumber` is 12 digits ending in a Luhn check digit.
    * `customerName` is mandatory; name identity is canonicalised (unicode NFKC fold,
      whitespace runs collapsed) and matched case-insensitively.
    * A customer may hold at most **5** savings accounts (enforced with a
      Postgres advisory lock; concurrent creations are safe).
    * `nickname` is optional; when present it must be 5-30 characters and pass an
      offensive-term screen.

    Error contract: every failure maps to RFC 9457 `application/problem+json`
    with a stable `type` URI. 503 responses carry `retryable: true` when the
    situation is transient (datastore outage, lock contention, allocation races).

    Security note: this exercise has no authn/authz (documented in
    `docs/DESIGN-TRADEOFFS.md` A7); read paths emit `Cache-Control: no-store, private`.
  contact:
    name: repository docs
    url: https://github.com/takehome/savings-accounts/blob/main/docs/ARCHITECTURE.md
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: "8080"
tags:
  - name: accounts
    description: Savings account lifecycle (currently create + read)

paths:
  /api/v1/accounts:
    post:
      operationId: createAccount
      summary: Create a savings account
      description: >
        Creates a new account for the customer named in the body. Id and account
        number are generated server-side. Responses carry a `Location` header of
        the created resource.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              withNickname:
                value:
                  customerName: Alice Tester
                  nickname: rainy day
              withoutNickname:
                value:
                  customerName: Alice Tester
      responses:
        '201':
          description: Account created
          headers:
            Location:
              description: URL of the created account
              schema:
                type: string
                example: /api/v1/accounts/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: >
            The customer already holds the maximum of 5 savings accounts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                limitReached:
                  value:
                    type: https://api.takehome.co.nz/errors/account-limit-reached
                    title: Conflict
                    status: 409
                    detail: Customer 'Alice Tester' already holds the maximum of 5 savings accounts
                    customerName: Alice Tester
                    maxAccounts: 5
                    timestamp: '2026-11-06T10:00:00Z'
        '503':
          $ref: '#/components/responses/DatastoreUnavailable'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/accounts/{id}:
    get:
      operationId: getAccountById
      summary: Fetch a savings account by surrogate id
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          description: Server-generated numeric id (sequential - see security note in info.description)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The account
          headers:
            Cache-Control:
              description: Always `no-store, private` - the payload carries personal data
              schema:
                type: string
                example: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatastoreUnavailable'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/accounts/by-number/{accountNumber}:
    get:
      operationId: getAccountByNumber
      summary: Fetch a savings account by its public account number
      description: >
        Preferred public lookup key. The number must be 12 digits and pass the
        Luhn check; malformed numbers are rejected with 400 before any datastore
        access. Lookups share the Redis cache with id lookups (key-namespace
        `number:`) and degrade to Postgres when Redis is unavailable.
      tags: [accounts]
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{12}$'
            example: "325748979052"
      responses:
        '200':
          description: The account
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: |
            Malformed request:
            * non-numeric path parameter id (`invalid-parameter`), or
            * account number failing the 12-digit/Luhn shape (`invalid-request`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatastoreUnavailable'
        default:
          $ref: '#/components/responses/ServerError'

components:
  responses:
    ValidationError:
      description: Request body failed bean validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingName:
              value:
                type: https://api.takehome.co.nz/errors/validation-failed
                title: Bad Request
                status: 400
                detail: Request body failed validation
                issues:
                  - field: customerName
                    message: customerName is mandatory
                timestamp: '2026-11-06T10:00:00Z'
    InvalidParameter:
      description: Path or request parameter has an invalid format
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            badId:
              value:
                type: https://api.takehome.co.nz/errors/invalid-parameter
                title: Bad Request
                status: 400
                detail: "Parameter 'id' has an invalid format"
                timestamp: '2026-11-06T10:00:00Z'
    NotFound:
      description: The requested account (or route) does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noAccount:
              value:
                type: https://api.takehome.co.nz/errors/account-not-found
                title: Not Found
                status: 404
                detail: Savings account 42 does not exist
                timestamp: '2026-11-06T10:00:00Z'
    DatastoreUnavailable:
      description: >
        Postgres or Redis unavailable, datastore timeout, advisory-lock contention
        (`contention`), allocation race lost (`allocation-collision`), or the
        account-number generator unable to allocate (`allocation-unavailable`).
        All are retryable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            datastore:
              value:
                type: https://api.takehome.co.nz/errors/datastore-unavailable
                title: Service Unavailable
                status: 503
                detail: The datastore is temporarily unavailable; please retry shortly.
                retryable: true
                timestamp: '2026-11-06T10:00:00Z'
            contention:
              value:
                type: https://api.takehome.co.nz/errors/contention
                title: Service Unavailable
                status: 503
                detail: Too much contention on this customer right now; please retry.
                retryable: true
                timestamp: '2026-11-06T10:00:00Z'
    ServerError:
      description: Unexpected server error (details logged, never leaked)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CreateAccountRequest:
      type: object
      description: >
        Nickname is stripped before validation; a whitespace-only nickname is a
        400, not an absent nickname. Use null / omit the field for "no nickname".
      required: [customerName]
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 100
          description: Mandatory; letters, spaces, hyphens, apostrophes, periods only.
          examples: [Alice Tester]
        nickname:
          type: string
          minLength: 5
          maxLength: 30
          description: Optional human label. Screened against the offensive-term list.
          examples: [rainy day]

    AccountResponse:
      type: object
      description: >
        Wire representation. Fields are server-generated; `nickname` is omitted
        from the JSON when absent.
      required: [id, accountNumber, customerName, createdAt]
      properties:
        id:
          type: integer
          format: int64
          description: Surrogate key (sequential)
          example: 1
        accountNumber:
          type: string
          description: 12 digits, last digit a Luhn check digit
          pattern: '^[0-9]{12}$'
          example: "325748979052"
        customerName:
          type: string
          example: Alice Tester
        nickname:
          type: string
          minLength: 5
          maxLength: 30
          example: rainy day
        createdAt:
          type: string
          format: date-time
          example: '2026-11-06T09:43:28.997740Z'

    Problem:
      type: object
      description: >
        RFC 9457 problem document. Extension members: `issues` (bean validation),
        `retryable` (503s), `customerName`/`maxAccounts` (quota), `timestamp`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable error type, always under https://api.takehome.co.nz/errors/
          examples:
            - https://api.takehome.co.nz/errors/validation-failed
            - https://api.takehome.co.nz/errors/account-not-found
            - https://api.takehome.co.nz/errors/account-limit-reached
            - https://api.takehome.co.nz/errors/datastore-unavailable
            - https://api.takehome.co.nz/errors/contention
            - https://api.takehome.co.nz/errors/allocation-collision
            - https://api.takehome.co.nz/errors/allocation-unavailable
            - https://api.takehome.co.nz/errors/malformed-body
            - https://api.takehome.co.nz/errors/invalid-parameter
            - https://api.takehome.co.nz/errors/invalid-request
            - https://api.takehome.co.nz/errors/route-not-found
            - https://api.takehome.co.nz/errors/method-not-allowed
            - https://api.takehome.co.nz/errors/internal-error
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        issues:
          type: array
          description: Present for `validation-failed`
          items:
            $ref: '#/components/schemas/FieldIssue'
        retryable:
          type: boolean
          description: Present on transient 503s; true means the caller should retry
        customerName:
          type: string
          description: Present on `account-limit-reached`
        maxAccounts:
          type: integer
          description: Present on `account-limit-reached`; always 5 today

    FieldIssue:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: nickname
        message:
          type: string
          example: nickname must be between 5 and 30 characters
